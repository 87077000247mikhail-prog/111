<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>izvestnyiobmennik</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;

    background-color: #f5f5f5;
    background-image: url("bg.jpg");
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
}

/* КНОПКА */
.telegram-button {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 28px;
    background: #0088cc;
    color: #fff;
    text-decoration: none;
    font-size: 18px;
    font-weight: 600;
    border-radius: 12px;
    transition: transform 0.2s, background 0.2s;
}

.telegram-button:hover {
    background: #006699;
    transform: scale(1.05);
}

.telegram-icon {
    width: 28px;
    height: 28px;
}

/* СЧЁТЧИК */
.counter {
    position: fixed;
    right: 12px;
    bottom: 12px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 14px;
}
</style>
</head>

<body>

<a class="telegram-button" href="https://t.me/izvestnyiobmennik" target="_blank" rel="noopener">
    <img class="telegram-icon" src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="tg">
    welcome
</a>

<div class="counter">
    Visits: <span id="visits">0</span>
</div>

<script>
fetch("https://api.countapi.xyz/hit/izvestnyiobmennik.online/visits")
  .then(res => res.json())
  .then(data => {
    document.getElementById("visits").innerText = data.value;
  })
  .catch(() => {
    document.getElementById("visits").innerText = "—";
  });
</script>

</body>
</html>
